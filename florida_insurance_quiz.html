<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FL Life &amp; Health Insurance Exam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;min-height:100vh;color:#1e293b}

/* START */
.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.start-icon{font-size:56px;margin-bottom:16px}
.start-title{font-size:24px;font-weight:800;margin-bottom:6px}
.start-sub{font-size:15px;color:#64748b;margin-bottom:28px;line-height:1.5}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px;margin-bottom:28px}
.info-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.info-num{font-size:26px;font-weight:800;color:#2563eb}
.info-lbl{font-size:11px;color:#94a3b8;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:#2563eb;color:#fff;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:700;cursor:pointer;width:100%;max-width:360px}

/* QUIZ */
.quiz-wrap{max-width:640px;margin:0 auto;padding-bottom:32px}
.quiz-header{background:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q-counter{font-size:13px;font-weight:600;color:#64748b}
.timer{font-size:13px;font-weight:600;color:#64748b;font-variant-numeric:tabular-nums}
.prog-track{background:#e2e8f0;border-radius:99px;height:5px;overflow:hidden}
.prog-fill{background:#2563eb;height:100%;border-radius:99px;transition:width .3s}
.q-card{background:#fff;margin:14px 14px 0;border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.section-badge{display:inline-block;background:#eff6ff;color:#2563eb;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.q-text{font-size:16px;line-height:1.6;font-weight:500;margin-bottom:18px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:flex-start;gap:11px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:13px 14px;cursor:pointer;text-align:left;width:100%;font-size:15px;color:#1e293b;line-height:1.45}
.choice.sel{border-color:#2563eb;background:#eff6ff}
.choice.right{border-color:#16a34a;background:#f0fdf4}
.choice.wrong{border-color:#dc2626;background:#fef2f2}
.c-letter{flex-shrink:0;width:27px;height:27px;border-radius:7px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#475569}
.choice.sel .c-letter{background:#2563eb;color:#fff}
.choice.right .c-letter{background:#16a34a;color:#fff}
.choice.wrong .c-letter{background:#dc2626;color:#fff}
.c-text{flex:1}
.feedback{margin:10px 14px 0;padding:13px 15px;border-radius:12px;font-size:14px;line-height:1.5}
.feedback.ok{background:#f0fdf4;border-left:4px solid #16a34a;color:#15803d}
.feedback.bad{background:#fef2f2;border-left:4px solid #dc2626;color:#b91c1c}
.note-box{margin-top:8px;font-size:13px;font-style:italic;opacity:.85}
.btn-action{display:block;background:#2563eb;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;width:calc(100% - 28px);margin:12px 14px 0}

/* RESULTS */
.results-wrap{max-width:640px;margin:0 auto;padding:20px 14px}
.score-ring{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 14px;border:5px solid}
.score-ring.pass{border-color:#16a34a;background:#f0fdf4}
.score-ring.fail{border-color:#dc2626;background:#fef2f2}
.score-pct{font-size:36px;font-weight:900;line-height:1}
.score-ring.pass .score-pct{color:#16a34a}
.score-ring.fail .score-pct{color:#dc2626}
.score-frac{font-size:12px;color:#94a3b8;margin-top:3px}
.pf-badge{display:inline-block;padding:5px 18px;border-radius:99px;font-size:14px;font-weight:800;margin-bottom:6px}
.pf-badge.pass{background:#16a34a;color:#fff}
.pf-badge.fail{background:#dc2626;color:#fff}
.res-sub{font-size:13px;color:#64748b;text-align:center;margin-bottom:18px}
.stat-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.stat-row:last-child{border-bottom:none}
.stat-lbl{color:#64748b}
.stat-val{font-weight:700}
.stat-val.g{color:#16a34a}
.stat-val.r{color:#dc2626}
.breakdown-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.breakdown-card h3{font-size:12px;font-weight:700;margin-bottom:14px;color:#475569;text-transform:uppercase;letter-spacing:.5px}
.sec-row{margin-bottom:12px}
.sec-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.sec-name{color:#475569;font-weight:500}
.sec-pct{font-weight:700}
.bar-track{background:#e2e8f0;border-radius:99px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.res-btns{display:flex;flex-direction:column;gap:10px}
.btn-dark{background:#1e293b;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn-blue{background:#2563eb;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;width:100%}

/* REVIEW */
.review-wrap{max-width:640px;margin:0 auto;padding:16px 14px}
.review-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.btn-back{background:#f1f5f9;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#475569}
.review-title{font-size:18px;font-weight:800}
.rev-item{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #dc2626}
.rev-meta{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.rev-q{font-size:15px;font-weight:500;line-height:1.55;margin-bottom:12px}
.rev-ans{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:9px;margin-bottom:6px;font-size:14px;line-height:1.4}
.rev-ans.yours{background:#fef2f2;color:#b91c1c}
.rev-ans.correct{background:#f0fdf4;color:#15803d}
.rev-albl{font-weight:800;flex-shrink:0;margin-right:4px}
.rev-note{margin-top:10px;font-size:13px;color:#64748b;line-height:1.5;padding:10px 12px;background:#f8fafc;border-radius:8px}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center;color:#64748b">Loading...</p></div>

<script>
var LETTERS = ['A','B','C','D'];

var state = {
  mode: 'start',
  qs: [],
  cur: 0,
  sel: null,
  confirmed: false,
  ans: [],
  elapsed: 0,
  interval: null
};

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function fmt(s) {
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  var ms = String(m).padStart(2,'0');
  var ss = String(sec).padStart(2,'0');
  return h ? (h + ':' + ms + ':' + ss) : (ms + ':' + ss);
}

function barColor(p) {
  return p >= 70 ? '#16a34a' : p >= 50 ? '#d97706' : '#dc2626';
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ---- actions ----
function startQuiz() {
  clearInterval(state.interval);
  state.qs = shuffle(ALL_Q);
  state.cur = 0;
  state.sel = null;
  state.confirmed = false;
  state.ans = [];
  for (var i = 0; i < state.qs.length; i++) state.ans.push(null);
  state.elapsed = 0;
  state.mode = 'quiz';
  state.interval = setInterval(function() {
    state.elapsed++;
    var el = document.getElementById('tmr');
    if (el) el.textContent = fmt(state.elapsed);
  }, 1000);
  render();
}

function pickAnswer(idx) {
  if (state.confirmed) return;
  state.sel = idx;
  render();
}

function submitAnswer() {
  if (state.sel === null) return;
  state.confirmed = true;
  state.ans[state.cur] = state.sel;
  render();
}

function nextQ() {
  if (state.cur < state.qs.length - 1) {
    state.cur++;
    state.sel = null;
    state.confirmed = false;
    render();
  } else {
    clearInterval(state.interval);
    state.mode = 'results';
    render();
  }
}

function showReview() { state.mode = 'review'; render(); }
function backToResults() { state.mode = 'results'; render(); }
function retake() { clearInterval(state.interval); state.mode = 'start'; render(); }

// ---- event delegation ----
document.addEventListener('click', function(e) {
  var el = e.target;
  while (el && el !== document.body) {
    var action = el.getAttribute('data-action');
    if (action) {
      var val = el.getAttribute('data-val');
      if (action === 'start') startQuiz();
      else if (action === 'pick') pickAnswer(parseInt(val));
      else if (action === 'submit') submitAnswer();
      else if (action === 'next') nextQ();
      else if (action === 'review') showReview();
      else if (action === 'results') backToResults();
      else if (action === 'retake') retake();
      return;
    }
    el = el.parentElement;
  }
});

// ---- render ----
function render() {
  var app = document.getElementById('app');
  if (!app) return;
  if (state.mode === 'start') app.innerHTML = renderStart();
  else if (state.mode === 'quiz') app.innerHTML = renderQuiz();
  else if (state.mode === 'results') app.innerHTML = renderResults();
  else app.innerHTML = renderReview();
}

function renderStart() {
  return '<div class="start-screen">' +
    '<div class="start-icon">&#x1F4CB;</div>' +
    '<h1 class="start-title">FL Life &amp; Health Insurance</h1>' +
    '<p class="start-sub">Official Practice Exam<br>Verified against Florida Statutes</p>' +
    '<div class="info-grid">' +
      '<div class="info-card"><div class="info-num">150</div><div class="info-lbl">Questions</div></div>' +
      '<div class="info-card"><div class="info-num">70%</div><div class="info-lbl">To Pass</div></div>' +
      '<div class="info-card"><div class="info-num">6</div><div class="info-lbl">Topics</div></div>' +
      '<div class="info-card"><div class="info-num">&#x221E;</div><div class="info-lbl">Randomized</div></div>' +
    '</div>' +
    '<button class="btn-primary" data-action="start">Start Practice Exam</button>' +
  '</div>';
}

function renderQuiz() {
  var q = state.qs[state.cur];
  var prog = (state.cur / state.qs.length) * 100;

  var choicesHtml = '';
  for (var i = 0; i < q.c.length; i++) {
    var cls = 'choice';
    if (state.confirmed) {
      if (i === q.a) cls += ' right';
      else if (i === state.sel && i !== q.a) cls += ' wrong';
    } else if (i === state.sel) {
      cls += ' sel';
    }
    choicesHtml += '<button class="' + cls + '" data-action="pick" data-val="' + i + '">' +
      '<span class="c-letter">' + LETTERS[i] + '</span>' +
      '<span class="c-text">' + esc(q.c[i]) + '</span>' +
    '</button>';
  }

  var fb = '';
  if (state.confirmed) {
    var ok = (state.sel === q.a);
    var msg = ok ? '&#x2713; Correct!' :
      '&#x2717; Incorrect. Correct answer: <strong>' + LETTERS[q.a] + ') ' + esc(q.c[q.a]) + '</strong>';
    var noteHtml = q.n ? '<div class="note-box">Note: ' + esc(q.n) + '</div>' : '';
    fb = '<div class="feedback ' + (ok ? 'ok' : 'bad') + '">' + msg + noteHtml + '</div>';
  }

  var actionBtn = '';
  if (state.confirmed) {
    var label = (state.cur === state.qs.length - 1) ? 'See My Results' : 'Next Question';
    actionBtn = '<button class="btn-action" data-action="next">' + label + ' &rarr;</button>';
  } else if (state.sel !== null) {
    actionBtn = '<button class="btn-action" data-action="submit">Submit Answer</button>';
  }

  return '<div class="quiz-wrap">' +
    '<div class="quiz-header">' +
      '<div class="header-row">' +
        '<span class="q-counter">Question ' + (state.cur + 1) + ' of ' + state.qs.length + '</span>' +
        '<span class="timer" id="tmr">' + fmt(state.elapsed) + '</span>' +
      '</div>' +
      '<div class="prog-track"><div class="prog-fill" style="width:' + prog + '%"></div></div>' +
    '</div>' +
    '<div class="q-card">' +
      '<div class="section-badge">' + esc(q.s) + '</div>' +
      '<p class="q-text">' + esc(q.q) + '</p>' +
      '<div class="choices">' + choicesHtml + '</div>' +
    '</div>' +
    fb + actionBtn +
  '</div>';
}

function renderResults() {
  var total = state.qs.length;
  var correct = 0;
  for (var i = 0; i < total; i++) {
    if (state.ans[i] === state.qs[i].a) correct++;
  }
  var pct = Math.round(correct / total * 100);
  var passed = pct >= 70;
  var missed = total - correct;

  var secs = {};
  for (var i = 0; i < state.qs.length; i++) {
    var sname = state.qs[i].s;
    if (!secs[sname]) secs[sname] = {c:0, t:0};
    secs[sname].t++;
    if (state.ans[i] === state.qs[i].a) secs[sname].c++;
  }

  var secHtml = '';
  for (var sname in secs) {
    var d = secs[sname];
    var p = Math.round(d.c / d.t * 100);
    var col = barColor(p);
    secHtml += '<div class="sec-row">' +
      '<div class="sec-header">' +
        '<span class="sec-name">' + esc(sname) + '</span>' +
        '<span class="sec-pct" style="color:' + col + '">' + d.c + '/' + d.t + ' (' + p + '%)</span>' +
      '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + p + '%;background:' + col + '"></div></div>' +
    '</div>';
  }

  var reviewBtn = missed > 0
    ? '<button class="btn-dark" data-action="review">Review ' + missed + ' Missed Question' + (missed !== 1 ? 's' : '') + '</button>'
    : '';

  return '<div class="results-wrap">' +
    '<div style="text-align:center;margin-bottom:16px">' +
      '<div class="score-ring ' + (passed ? 'pass' : 'fail') + '">' +
        '<div class="score-pct">' + pct + '%</div>' +
        '<div class="score-frac">' + correct + '/' + total + '</div>' +
      '</div>' +
      '<span class="pf-badge ' + (passed ? 'pass' : 'fail') + '">' + (passed ? '&#x2713; PASS' : '&#x2717; NEEDS REVIEW') + '</span>' +
      '<p class="res-sub">' + (passed ? "Great work! You're exam ready." : "Keep studying — you're getting there!") + '</p>' +
    '</div>' +
    '<div class="stat-card">' +
      '<div class="stat-row"><span class="stat-lbl">Correct</span><span class="stat-val g">' + correct + '</span></div>' +
      '<div class="stat-row"><span class="stat-lbl">Incorrect</span><span class="stat-val r">' + missed + '</span></div>' +
      '<div class="stat-row"><span class="stat-lbl">Score</span><span class="stat-val">' + pct + '%' + (passed ? ' &#x2713;' : '') + '</span></div>' +
      '<div class="stat-row"><span class="stat-lbl">Time</span><span class="stat-val">' + fmt(state.elapsed) + '</span></div>' +
      '<div class="stat-row"><span class="stat-lbl">Passing Score</span><span class="stat-val">70% (105/150)</span></div>' +
    '</div>' +
    '<div class="breakdown-card"><h3>Score by Topic</h3>' + secHtml + '</div>' +
    '<div class="res-btns">' + reviewBtn + '<button class="btn-blue" data-action="retake">New Randomized Test</button></div>' +
  '</div>';
}

function renderReview() {
  var missed = [];
  for (var i = 0; i < state.qs.length; i++) {
    if (state.ans[i] !== state.qs[i].a) missed.push({q: state.qs[i], u: state.ans[i], i: i});
  }

  var items = '';
  for (var k = 0; k < missed.length; k++) {
    var m = missed[k];
    var uText = m.u !== null ? LETTERS[m.u] + ') ' + esc(m.q.c[m.u]) : 'Not answered';
    items += '<div class="rev-item">' +
      '<div class="rev-meta">' + esc(m.q.s) + ' &middot; Q' + (m.i + 1) + '</div>' +
      '<div class="rev-q">' + esc(m.q.q) + '</div>' +
      '<div class="rev-ans yours"><span class="rev-albl">Your answer:</span>' + uText + '</div>' +
      '<div class="rev-ans correct"><span class="rev-albl">Correct:</span>' + LETTERS[m.q.a] + ') ' + esc(m.q.c[m.q.a]) + '</div>' +
      (m.q.n ? '<div class="rev-note">Note: ' + esc(m.q.n) + '</div>' : '') +
    '</div>';
  }

  return '<div class="review-wrap">' +
    '<div class="review-hdr">' +
      '<button class="btn-back" data-action="results">&larr; Back</button>' +
      '<h2 class="review-title">Missed Questions (' + missed.length + ')</h2>' +
    '</div>' +
    items +
    '<button class="btn-blue" style="width:100%;margin-top:4px" data-action="retake">New Randomized Test</button>' +
  '</div>';
}

// ---- question data ----
var ALL_Q = [
// LIFE INSURANCE 1-30
{q:"What is the primary purpose of life insurance?",c:["To provide income during retirement","To replace lost income and cover financial obligations upon the insured's death","To pay medical expenses","To fund a college education"],a:1,s:"Life Insurance"},
{q:"Which of the following best defines insurable interest in a life insurance policy?",c:["The policyholder's desire to profit from the insured's death","A financial relationship where the policyholder would suffer a financial loss upon the insured's death","The insured's interest in keeping the policy in force","The insurance company's interest in collecting premiums"],a:1,s:"Life Insurance"},
{q:"Under a whole life insurance policy, cash value:",c:["Decreases over time","Accumulates on a tax-deferred basis","Is only available after age 65","Does not exist"],a:1,s:"Life Insurance"},
{q:"Term life insurance provides coverage:",c:["For the insured's entire lifetime","Only if premiums are paid for 20 years","For a specified period of time","Until the insured reaches age 65"],a:2,s:"Life Insurance"},
{q:"Which type of policy combines term insurance with a separate savings element?",c:["Whole life","Universal life","Term life","Variable annuity"],a:1,s:"Life Insurance"},
{q:"A level premium means:",c:["Premiums increase each year","Premiums decrease as the insured ages","Premiums remain the same throughout the policy period","Premiums are paid all at once"],a:2,s:"Life Insurance"},
{q:"The free look period for life insurance in Florida is:",c:["10 days","14 days","21 days","30 days"],a:1,s:"Life Insurance",n:"Florida Statute 627.4555 requires a minimum 14-day free-look period for life insurance."},
{q:"Which rider allows a policyholder to purchase additional insurance without a medical exam?",c:["Accidental Death Benefit rider","Waiver of Premium rider","Guaranteed Insurability rider","Return of Premium rider"],a:2,s:"Life Insurance"},
{q:"The incontestability clause in a life insurance policy states that the insurer:",c:["Can cancel the policy at any time for any reason","Cannot contest the policy after it has been in force for 2 years","Must pay double the face value if death is accidental","May contest any claim made within 5 years"],a:1,s:"Life Insurance"},
{q:"A beneficiary is:",c:["The person insured under the policy","The person or entity that receives the death benefit","The insurance agent selling the policy","The insurance company"],a:1,s:"Life Insurance"},
{q:"What is the purpose of the suicide clause in life insurance?",c:["To exclude coverage if the insured is involved in dangerous activities","To deny claims if suicide occurs within the first 2 years of the policy","To provide extra benefits if death occurs unexpectedly","To protect the insurer from fraudulent claims"],a:1,s:"Life Insurance"},
{q:"Variable life insurance differs from whole life because:",c:["It has no cash value","The death benefit and cash value fluctuate based on investment performance","Premiums are flexible","It only covers accidental death"],a:1,s:"Life Insurance"},
{q:"Universal life insurance provides:",c:["Fixed premiums and fixed death benefit only","Flexible premiums and adjustable death benefits","Coverage only for 20 years","No cash value accumulation"],a:1,s:"Life Insurance"},
{q:"The automatic premium loan provision:",c:["Allows the insurer to increase premiums automatically","Automatically borrows from cash value to pay overdue premiums","Provides an automatic loan to the beneficiary upon death","Converts term insurance to whole life"],a:1,s:"Life Insurance"},
{q:"Which of the following is NOT a nonforfeiture option?",c:["Extended term insurance","Reduced paid-up insurance","Cash surrender value","Dividend accumulation"],a:3,s:"Life Insurance"},
{q:"A policy loan on a life insurance policy:",c:["Must be repaid within 5 years","Reduces the death benefit if not repaid","Requires the insured to pass a medical exam","Cancels the policy automatically"],a:1,s:"Life Insurance"},
{q:"Which type of life insurance is typically used to fund business partnership buy-sell agreements?",c:["Group term life","Individual whole life or term","Variable universal life","Credit life insurance"],a:1,s:"Life Insurance"},
{q:"Key person insurance is designed to:",c:["Provide retirement income for executives","Protect a business from financial loss due to the death of a key employee","Cover all employees of a company","Fund employee benefit plans"],a:1,s:"Life Insurance"},
{q:"The spendthrift clause in a life insurance policy:",c:["Limits the amount the insured can borrow","Protects policy proceeds from the beneficiary's creditors","Prevents the policyholder from changing beneficiaries","Requires a lump-sum payment to beneficiaries"],a:1,s:"Life Insurance"},
{q:"Which settlement option pays the death benefit in fixed installments over a specified period?",c:["Interest only option","Fixed period option","Life income option","Fixed amount option"],a:1,s:"Life Insurance"},
{q:"An irrevocable beneficiary designation means:",c:["The beneficiary can be changed at any time","The policyholder cannot change the beneficiary without the beneficiary's consent","The beneficiary receives a guaranteed minimum benefit","The designation automatically changes upon divorce"],a:1,s:"Life Insurance"},
{q:"Which of the following is TRUE about group life insurance?",c:["Each insured receives an individual policy","Coverage is provided under a master contract issued to the employer","Medical examinations are always required","Premiums are paid entirely by employees"],a:1,s:"Life Insurance"},

// HEALTH INSURANCE 51-90
{q:"An indemnity health plan:",c:["Requires the insured to use network providers only","Pays a predetermined amount regardless of actual charges","Reimburses actual medical expenses up to a maximum","Provides coverage only for hospitalization"],a:1,s:"Health Insurance"},

{q:"Under Florida law, the minimum grace period for individual health insurance premiums is:",c:["7 days","10 days","31 days","60 days"],a:2,s:"Health Insurance"},

{q:"Medicare Part D covers:",c:["Doctor visits","Hospital stays","Outpatient prescription drugs","Hospice care"],a:2,s:"Health Insurance"},

// DISABILITY INCOME 91-110
{q:"Disability income insurance is designed to:",c:["Pay medical bills during a disability","Replace a portion of the insured's income if they become disabled and unable to work","Provide a lump-sum payment upon permanent disability","Cover rehabilitation costs only"],a:1,s:"Disability Income"},
{q:"The own occupation definition of disability means:",c:["The insured is disabled if they cannot perform any occupation","The insured is considered disabled if they cannot perform the duties of their own specific occupation","Benefits are paid only if the insured is permanently disabled","The insured must be employed at the time of the claim"],a:1,s:"Disability Income"},

{q:"The own occupation definition of disability is most commonly found in:",c:["Group disability policies","Individual policies marketed to professionals such as physicians and attorneys","Workers Compensation policies","Social Security disability programs"],a:1,s:"Disability Income"},
{q:"Under Florida law, how long can an insurer require proof of loss to be submitted for a disability claim?",c:["30 days after the loss","60 days after the loss","90 days after the termination of the period for which the insurer is liable","1 year after the loss"],a:2,s:"Disability Income"},
// LONG-TERM CARE 111-125
{q:"Long-term care (LTC) insurance is designed to cover:",c:["Short-term hospital stays","Extended care needs for individuals who cannot perform activities of daily living due to chronic illness, disability, or cognitive impairment","Acute medical conditions requiring hospitalization","Prescription drug costs for the elderly"],a:1,s:"Long-Term Care"},

{q:"How long must a LTC policy have been in force before Florida law requires the insurer to offer a nonforfeiture option?",c:["1 year","3 years","5 years","10 years"],a:1,s:"Long-Term Care"},
{q:"Respite care benefits in a LTC policy are designed to:",c:["Provide palliative care for terminally ill patients","Provide temporary relief to informal caregivers such as family members","Pay for residential respite programs for the insured","Cover costs of moving to a new care facility"],a:1,s:"Long-Term Care"},
