# Netlify config for the FEX Pitch Coach app (lives in pitch-coach/).
[build]
  base = "pitch-coach"
  publish = "."
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20" }

[functions]
  node_bundler = "esbuild"

# Pretty API paths -> serverless functions
[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200
